<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Parallel Decision Tree Hardware Architecture</title>
  <desc id="desc">Shared I-Memory and AD-Memory feed three parallel Universal Nodes. Logic selects a class or feeds the next node address back to AD-Memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feColorMatrix in="offset" values="0 0 0 0 0.03 0 0 0 0 0.13 0 0 0 0 0.25 0 0 0 .16 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#1677b8"/>
    </marker>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif}.h{font-size:35px;font-weight:800;fill:#0b2340}.k{font-size:17px;font-weight:700;letter-spacing:2px;fill:#1677b8}.b{font-size:24px;font-weight:750;fill:#102c4d}.s{font-size:15px;font-weight:600;fill:#5c7188}.m{font-size:14px;font-weight:700;fill:#29445f}.line{fill:none;stroke:#1677b8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#4aa4d7;stroke-width:3;stroke-dasharray:9 9}.box{fill:url(#node);stroke:#66aada;stroke-width:2}.mini{fill:#edf7ff;stroke:#9bc9e7;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="704" rx="24" fill="none" stroke="#c7dced" stroke-width="2"/>

  <g class="t">
    <text x="78" y="84" class="k">SUBMITTED PAPER FIG. 1 · PRESENTATION SLIDE 5</text>
    <text x="78" y="130" class="h">Parallel Decision Tree Data Path</text>
    <text x="78" y="161" class="s">One input vector · current node and both child nodes evaluated in parallel</text>

    <g filter="url(#shadow)">
      <rect x="92" y="257" width="226" height="92" rx="18" class="box"/>
      <text x="205" y="299" text-anchor="middle" class="b">I-Memory</text>
      <text x="205" y="326" text-anchor="middle" class="s">shared input vector</text>

      <rect x="92" y="433" width="226" height="92" rx="18" class="box"/>
      <text x="205" y="475" text-anchor="middle" class="b">AD-Memory</text>
      <text x="205" y="502" text-anchor="middle" class="s">current / child address</text>
    </g>

    <path d="M205 349V433" class="line" marker-end="url(#arrow)"/>
    <path d="M318 479H397V245H456" class="line" marker-end="url(#arrow)"/>
    <path d="M318 479H718V245H777" class="line" marker-end="url(#arrow)"/>
    <path d="M318 479H1039V245H1098" class="line" marker-end="url(#arrow)"/>
    <path d="M318 303H382V275H456" class="dash" marker-end="url(#arrow)"/>
    <path d="M318 303H703V275H777" class="dash" marker-end="url(#arrow)"/>
    <path d="M318 303H1024V275H1098" class="dash" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <g>
        <rect x="456" y="205" width="262" height="304" rx="22" class="box"/>
        <rect x="456" y="205" width="262" height="62" rx="22" fill="#0f5f99"/>
        <path d="M456 245H718" stroke="#0f5f99" stroke-width="44"/>
        <text x="587" y="244" style="fill:#fff" text-anchor="middle" class="b">UN1</text>
        <text x="587" y="292" text-anchor="middle" class="s">CURRENT NODE</text>
        <rect x="480" y="315" width="104" height="56" rx="11" class="mini"/>
        <rect x="590" y="315" width="104" height="56" rx="11" class="mini"/>
        <rect x="480" y="382" width="104" height="56" rx="11" class="mini"/>
        <rect x="590" y="382" width="104" height="56" rx="11" class="mini"/>
        <text x="532" y="349" text-anchor="middle" class="m">A-Memory</text>
        <text x="642" y="349" text-anchor="middle" class="m">C-Memory</text>
        <text x="532" y="416" text-anchor="middle" class="m">M2</text>
        <text x="642" y="416" text-anchor="middle" class="m">Decision</text>
        <text x="587" y="475" text-anchor="middle" class="s">attribute · threshold · branch</text>
      </g>

      <g>
        <rect x="777" y="205" width="262" height="304" rx="22" class="box"/>
        <rect x="777" y="205" width="262" height="62" rx="22" fill="#147db6"/>
        <path d="M777 245H1039" stroke="#147db6" stroke-width="44"/>
        <text x="908" y="244" style="fill:#fff" text-anchor="middle" class="b">UN2</text>
        <text x="908" y="292" text-anchor="middle" class="s">LEFT CHILD</text>
        <rect x="801" y="315" width="104" height="56" rx="11" class="mini"/>
        <rect x="911" y="315" width="104" height="56" rx="11" class="mini"/>
        <rect x="801" y="382" width="104" height="56" rx="11" class="mini"/>
        <rect x="911" y="382" width="104" height="56" rx="11" class="mini"/>
        <text x="853" y="349" text-anchor="middle" class="m">A-Memory</text>
        <text x="963" y="349" text-anchor="middle" class="m">C-Memory</text>
        <text x="853" y="416" text-anchor="middle" class="m">M2</text>
        <text x="963" y="416" text-anchor="middle" class="m">Decision</text>
        <text x="908" y="475" text-anchor="middle" class="s">speculative execution</text>
      </g>

      <g>
        <rect x="1098" y="205" width="262" height="304" rx="22" class="box"/>
        <rect x="1098" y="205" width="262" height="62" rx="22" fill="#1496c4"/>
        <path d="M1098 245H1360" stroke="#1496c4" stroke-width="44"/>
        <text x="1229" y="244" style="fill:#fff" text-anchor="middle" class="b">UN3</text>
        <text x="1229" y="292" text-anchor="middle" class="s">RIGHT CHILD</text>
        <rect x="1122" y="315" width="104" height="56" rx="11" class="mini"/>
        <rect x="1232" y="315" width="104" height="56" rx="11" class="mini"/>
        <rect x="1122" y="382" width="104" height="56" rx="11" class="mini"/>
        <rect x="1232" y="382" width="104" height="56" rx="11" class="mini"/>
        <text x="1174" y="349" text-anchor="middle" class="m">A-Memory</text>
        <text x="1284" y="349" text-anchor="middle" class="m">C-Memory</text>
        <text x="1174" y="416" text-anchor="middle" class="m">M2</text>
        <text x="1284" y="416" text-anchor="middle" class="m">Decision</text>
        <text x="1229" y="475" text-anchor="middle" class="s">speculative execution</text>
      </g>
    </g>

    <path d="M587 509V574H775" class="line"/>
    <path d="M908 509V574" class="line"/>
    <path d="M1229 509V574H1041" class="line"/>

    <g filter="url(#shadow)">
      <rect x="775" y="540" width="266" height="96" rx="18" class="box"/>
      <text x="908" y="581" text-anchor="middle" class="b">Logic</text>
      <text x="908" y="609" text-anchor="middle" class="s">4-case node / leaf selection</text>
    </g>
    <path d="M908 636V698" class="line" marker-end="url(#arrow)"/>
    <text x="908" y="728" text-anchor="middle" class="b">Class</text>
    <path d="M1041 588H1466V183H360V392H205V433" class="line" marker-end="url(#arrow)"/>
    <text x="1388" y="460" class="k">NEXT NODE</text>

    <rect x="488" y="172" width="840" height="28" rx="14" fill="#d8effc"/>
    <text x="908" y="192" text-anchor="middle" class="m">THREE UNIVERSAL NODES RUN IN PARALLEL</text>
  </g>
</svg>
